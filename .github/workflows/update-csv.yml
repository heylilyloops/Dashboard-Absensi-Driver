name: Update CSV Absensi dari Google Sheets

on:
  schedule:
    - cron: '0 0 * * *'   # setiap hari 07.00 WIB
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth pandas

      - name: Tarik data dari Sheets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/update_csv.py

      - name: Commit & push CSV
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-update absensi $(date +'%Y-%m-%d')"
          git push
